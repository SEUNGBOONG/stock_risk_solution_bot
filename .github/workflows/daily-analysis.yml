name: Portfolio manual

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "full=domestic+overseas scan, domestic=domestic only, overseas=overseas only"
        type: choice
        default: full
        options:
          - full
          - domestic
          - overseas

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      RUN_MODE: ${{ github.event.inputs.run_mode || 'full' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
          KIS_ACCOUNTS: ${{ secrets.KIS_ACCOUNTS }}
          USE_MOCK_BALANCE: "false"
        run: python -m src.main
